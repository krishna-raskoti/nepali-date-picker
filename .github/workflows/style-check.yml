name: style-check

on:
  push:
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

permissions:
  contents: read

jobs:
  style-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style (fails the build; does not modify files)
        run: vendor/bin/pint --test